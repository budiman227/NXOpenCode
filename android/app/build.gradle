plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nxteam.nxopencode'
    compileSdk 34

    defaultConfig {
        applicationId "com.nxteam.nxopencode"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("NXOPENCODE_KEYSTORE") ?: "debug.keystore")
            storePassword System.getenv("NXOPENCODE_KEYSTORE_PASSWORD") ?: "android"
            keyAlias System.getenv("NXOPENCODE_KEY_ALIAS") ?: "androiddebugkey"
            keyPassword System.getenv("NXOPENCODE_KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    androidResources {
        noCompress 'js', 'wasm', 'json'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
}
