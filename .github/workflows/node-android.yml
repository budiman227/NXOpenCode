name: node-android

on:
  workflow_dispatch:
    inputs:
      node_tag:
        description: Node.js source tag
        required: false
        default: v26.4.0
      sdk_version:
        description: Android API level
        required: false
        default: "24"

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 ninja-build patch

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          local-cache: false

      - name: Fetch Node.js source
        run: git clone --depth 1 --branch "${{ inputs.node_tag }}" https://github.com/nodejs/node.git node-src

      - name: Apply Termux Android patches
        working-directory: node-src
        run: |
          set -e
          BASE=https://raw.githubusercontent.com/termux/termux-packages/master/packages/nodejs
          PATCHES="
            avoid-ficlone-ioctl.patch
            common.gypi.patch
            deps-uv-src-unix-core.c.patch
            deps-uv-src-unix-process.c.patch
            deps-uv-uv.gyp.patch
            deps-uvwasi-src-uvwasi.c.patch
            deps-v8-src-flags-flag-definitions.h.patch
            deps-v8-src-trap-handler-trap-handler.h.patch
            fix_multiple_definitions.patch
            lib-child_process.js.patch
            lib-os.js.patch
            node.gyp.patch
            src-debug_utils.cc.patch
            src-getaddrinfo.patch
            src-node_internals.h.patch
            src-node_report.cc.patch
            tools-gyp-pylib-gyp-generator-ninja.py.patch
            tools-v8_gypfiles-toolchain.gypi.patch
            tools-v8_gypfiles-v8.gyp.patch
          "
          mkdir -p /tmp/patches
          FAILED=""
          for name in $PATCHES; do
            curl -fsSL "$BASE/$name" -o "/tmp/patches/$name"
            if patch -p1 -N --no-backup-if-mismatch -i "/tmp/patches/$name"; then
              echo "applied $name"
            else
              echo "FAILED $name"
              FAILED="$FAILED $name"
            fi
          done
          echo "failed patches:$FAILED"
          echo "PATCH_FAILURES=$FAILED" >> "$GITHUB_ENV"

      - name: Configure and build
        working-directory: node-src
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -e
          set -o pipefail
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          export PATH="$PATH:$TOOLCHAIN/bin"

          export CC="$TOOLCHAIN/bin/aarch64-linux-android${{ inputs.sdk_version }}-clang"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android${{ inputs.sdk_version }}-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export CC_host=clang
          export CXX_host=clang++
          export LINK_host=clang++

          export CFLAGS="-Daligned_alloc=memalign"
          export CXXFLAGS="-Daligned_alloc=memalign"

          export GYP_DEFINES="host_os=linux"

          "$CC" --version

          ./configure \
            --dest-cpu=arm64 \
            --dest-os=android \
            --cross-compiling \
            --without-npm \
            --without-corepack \
            --without-node-snapshot \
            --openssl-no-asm \
            --with-intl=small-icu \
            --ninja

          test -f config.gypi || { echo "configure produced no config.gypi"; exit 1; }

          ninja -C out/Release -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/node-build.log"

          test -f out/Release/node || { echo "node binary was not produced"; exit 1; }
          file out/Release/node

      - name: Strip and verify
        working-directory: node-src
        run: |
          set -e
          "$TOOLCHAIN/bin/llvm-strip" out/Release/node
          mkdir -p ../artifact
          cp out/Release/node ../artifact/libnode.so
          cp "$TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" ../artifact/libc++_shared.so
          cd ../artifact
          file libnode.so
          readelf -d libnode.so | grep NEEDED
          ls -lh

      - name: Capture failure log
        if: failure()
        run: |
          mkdir -p artifact
          {
            echo "failed patches: ${PATCH_FAILURES:-none}"
            echo
            echo "=== matched errors ==="
            grep -nE "error:|fatal error|No rule to make|ninja: build stopped|FAILED:" "$GITHUB_WORKSPACE/node-build.log" | head -n 60 || true
            echo
            echo "=== last 200 lines ==="
            tail -n 200 "$GITHUB_WORKSPACE/node-build.log" || echo "no build log"
          } > artifact/error.txt 2>&1
          wc -l artifact/error.txt

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            let log = 'no log captured'
            try { log = fs.readFileSync('artifact/error.txt', 'utf8').slice(-40000) } catch {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Node build failed: run ${context.runId}`,
              body: '```\n' + log + '\n```',
            })

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-android-arm64
          path: artifact/

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="node-arm64-${{ inputs.node_tag }}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --title "Node.js for Android arm64 (${{ inputs.node_tag }})" \
            --notes "Cross-compiled with NDK r26d, API ${{ inputs.sdk_version }}, small-icu, Termux Android patches." \
            artifact/libnode.so artifact/libc++_shared.so
